<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Arena Scoreboard</title>

<style>
html,body{
  margin:0;
  padding:0;
  background:#1b1b1b;
  font-family:Arial,sans-serif;
  color:#fff;
}
body{padding:20px}

.scoreboard{
  background:#2e1c16;
  border-radius:12px;
  padding:15px;
  box-shadow:0 0 12px rgba(0,0,0,.6)
}

h1{
  text-align:center;
  color:#ffc266;
  font-family:Georgia,serif;
  margin-bottom:12px
}

.top-controls{text-align:right;margin-bottom:10px}
.top-controls button{
  background:#ff6666;
  color:#fff;
  border:none;
  padding:6px 14px;
  border-radius:6px;
  cursor:pointer
}

/* 🔥 horizontal scroll wrapper */
.table-wrapper{
  overflow-x:auto;
}

/* table */
table{
  width:max-content;        /* 🔑 allow side expand */
  min-width:100%;
  border-collapse:collapse;
  font-size:13px;
}

th,td{
  border:2px solid #c59b61;
  padding:6px;
  text-align:center;
  white-space:nowrap;
}

th{
  background:#c59b61;
  color:#000;
  font-weight:bold;
}

td{
  background:rgba(44,23,18,.95);
}

/* column widths */
th.rank,td.rank{width:40px}
th.small,td.small{width:50px}
th.total,td.total{width:60px}

/* team name */
.team-name{
  font-size:12px;
  font-weight:600;
  padding:2px 6px;
  outline:none;
  white-space:nowrap;      /* 🔑 single line */
}

/* number input */
input{
  background:transparent;
  border:none;
  color:#fff;
  outline:none;
  font-size:13px;
  width:40px;
  text-align:center;
}

/* buttons */
.buttons{text-align:center;margin-top:16px}
.button-row{
  display:flex;
  gap:14px;
  justify-content:center
}

button{
  background:#ffc266;
  border:none;
  padding:10px 18px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer
}
button:hover{background:#e6b35b}

/* footer */
.footer{
  margin-top:14px;
  text-align:center;
  font-size:12px;
  color:#c59b61
}
.footer a{
  color:#ffc266;
  text-decoration:none;
  font-weight:bold
}

.saving .hide-during-save,
.saving .top-controls{display:none}
</style>
</head>

<body>

<div class="scoreboard" id="capture-area">

<div class="top-controls">
<button onclick="clearAll()">Clear All</button>
</div>

<h1>🏆 GAME ARENA 🏆</h1>

<div class="table-wrapper">
<table id="scoreTable">
<thead>
<tr>
  <th class="rank">Rank</th>
  <th>Team Name</th>
  <th class="small">Win</th>
  <th class="small">Kill</th>
  <th class="small">Pos</th>
  <th class="total">Total</th>
</tr>
</thead>

<tbody>
<script>
for(let i=1;i<=12;i++){
document.write(`
<tr>
  <td class="rank">${i}</td>
  <td><div class="team-name" contenteditable="true">Team name</div></td>
  <td class="small"><input class="win" type="number" min="0"></td>
  <td class="small"><input class="kill" type="number" min="0"></td>
  <td class="small"><input class="pos" type="number" min="1" max="10"></td>
  <td class="total">0</td>
</tr>
`)
}
</script>
</tbody>
</table>
</div>

<div class="buttons hide-during-save">
  <div class="button-row">
    <button onclick="sortByTotal()">Update Rank</button>
    <button onclick="downloadAsImage()">Save</button>
  </div>
</div>

<div class="footer">
All Rights Reserved. Developed by
<a href="https://t.me/NeoEchoo" target="_blank">Neo.exe</a>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
const posPointMap={1:12,2:9,3:8,4:7,5:6,6:5,7:4,8:3,9:2,10:1}

function calculateTotal(row){
  const kill=+row.querySelector('.kill').value||0
  const pos=+row.querySelector('.pos').value||0
  const total=kill+(posPointMap[pos]||0)
  row.querySelector('.total').innerText=total
  return total
}

function saveData(){
  const data=[]
  document.querySelectorAll('#scoreTable tbody tr').forEach(r=>{
    data.push({
      team:r.querySelector('.team-name').innerText,
      win:r.querySelector('.win').value,
      kill:r.querySelector('.kill').value,
      pos:r.querySelector('.pos').value
    })
  })
  localStorage.setItem('scoreData',JSON.stringify(data))
}

function loadData(){
  const data=JSON.parse(localStorage.getItem('scoreData')||'[]')
  document.querySelectorAll('#scoreTable tbody tr').forEach((r,i)=>{
    if(!data[i])return
    r.querySelector('.team-name').innerText=data[i].team
    r.querySelector('.win').value=data[i].win
    r.querySelector('.kill').value=data[i].kill
    r.querySelector('.pos').value=data[i].pos
    calculateTotal(r)
  })
}

function sortByTotal(){
  const tbody=document.querySelector('#scoreTable tbody')
  const rows=[...tbody.querySelectorAll('tr')]
  rows.sort((a,b)=>calculateTotal(b)-calculateTotal(a))
  rows.forEach((r,i)=>{
    r.querySelector('.rank').innerText=i+1
    tbody.appendChild(r)
  })
  saveData()
}

document.addEventListener('input',e=>{
  if(e.target.matches('.team-name,.win,.kill,.pos')){
    calculateTotal(e.target.closest('tr'))
    saveData()
  }
})

function clearAll(){
  localStorage.removeItem('scoreData')
  location.reload()
}

function downloadAsImage(){
  document.body.classList.add('saving')
  html2canvas(document.getElementById('capture-area'),{
    scale:2,
    backgroundColor:'#1b1b1b'
  }).then(c=>{
    const a=document.createElement('a')
    a.download='game_arena_scoreboard.png'
    a.href=c.toDataURL()
    a.click()
    document.body.classList.remove('saving')
  })
}

loadData()
</script>

</body>
</html>
